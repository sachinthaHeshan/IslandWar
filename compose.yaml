services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: islandwar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: islandwar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U islandwar -d islandwar"]
      interval: 3s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://islandwar:${POSTGRES_PASSWORD}@postgres:5432/islandwar?sslmode=disable
      APP_ORIGIN: ${GAME_ORIGIN:-https://island-war.orionlabs.lk}
      COOKIE_SECURE: "true"
    ports:
      - "8201:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_ORIGIN: ${API_ORIGIN:-https://island-war-api.orionlabs.lk}
    ports:
      - "8200:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
